name = "wordbridge-edu"
main = "src/index.js"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Workers Static Assets (CSS, JS, Branding, Specialized Vocab Datasets)
[assets]
directory = "./public"
binding = "ASSETS"

# Native Cloudflare D1 Database (One Domain — One Platform)
[[d1_databases]]
binding = "DB"
database_name = "word"
database_id = "ce84cc48-6d49-409b-b45a-13ba3bc4a771"
migrations_dir = "database/migrations"

# Native Cloudflare R2 Bucket (Audio, Reader PDFs, Learning Assets)
[[r2_buckets]]
binding = "R2"
bucket_name = "word"

[vars]
APP_NAME = "WORD BRIDGE"
APP_TAGLINE = "Where Languages Bring People Together."
APP_BASE_URL = "https://wordbridge.io.vn"
WEBAUTHN_RP_ID = "wordbridge.io.vn"
WEBAUTHN_RP_NAME = "WORD BRIDGE"
COOKIE_DOMAIN = "wordbridge.io.vn"
ENVIRONMENT = "production"

[triggers]
crons = ["*/15 * * * *"]

[observability]
enabled = true
