name = "wordbridge"
main = "src/worker.ts"
compatibility_date = "2026-11-15"
compatibility_flags = ["nodejs_compat"]

# ============================================================================
# WORD BRIDGE - CẤU HÌNH CLOUDFLARE WORKERS (KHÔNG SỬ DỤNG R2 / KHÔNG SỬ DỤNG D1)
# Có đầy đủ entry-point `main = "src/worker.ts"` và `[assets]` để `npx wrangler deploy`
# build và triển khai thành công ngay lập tức.
# ============================================================================

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]
NEXT_PUBLIC_SITE_URL = "https://wordbridge.io.vn"
WB_STORAGE_SERVICE_URL = "https://storage-internal.wordbridge.io.vn"
