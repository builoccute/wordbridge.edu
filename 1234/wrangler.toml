name = "word-bridge-main"
main = "src/index.js"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Workers Static Assets — KHẮC PHỤC TRIỆT ĐỂ LỖI 404 CSS/JS/LOGO
[assets]
directory = "./public"
binding = "ASSETS"

# ZERO-D1 & ZERO-R2: Toàn bộ SQLite, Lưu trữ file, DNS và API đặt tập trung tại quantri.wordbridge.io.vn
[vars]
APP_NAME = "WORD BRIDGE"
APP_TAGLINE = "Where Languages Bring People Together."
APP_BASE_URL = "https://wordbridge.io.vn"
PORTAL_BASE_URL = "https://portal.wordbridge.io.vn"
PDF_READER_BASE_URL = "https://reader.wordbridge.io.vn"
EXAM_BASE_URL = "https://exam.wordbridge.io.vn"
HELP_BASE_URL = "https://help.wordbridge.io.vn"
QUANTRI_API_BASE_URL = "https://quantri.wordbridge.io.vn"
COOKIE_DOMAIN = ".wordbridge.io.vn"
ENVIRONMENT = "production"

[observability]
enabled = true
