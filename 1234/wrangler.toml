name = "wordbridge"
main = "worker.js"
compatibility_date = "2026-11-15"
workers_dev = false
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/health"]

[[d1_databases]]
binding = "DB"
database_name = "word"
database_id = "ce84cc48-6d49-409b-b45a-13ba3bc4a771"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "R2"
bucket_name = "word"

[vars]
APP_ORIGIN = "https://wordbridge.io.vn"
PUBLIC_REGISTRATION = "true"
