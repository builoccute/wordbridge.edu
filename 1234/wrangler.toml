name = "word-bridge"
main = "src/index.js"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_NAME = "WORD BRIDGE"
APP_TAGLINE = "Where Languages Bring People Together."
APP_BASE_URL = "https://www.wordbridge.vn"
PDF_READER_BASE_URL = "https://reader.wordbridge.vn"
EMAIL_FROM_NOREPLY = "WORD BRIDGE <noreply@wordbridge.vn>"
EMAIL_FROM_CSKH = "WORD BRIDGE <cskh@wordbridge.vn>"
EMAIL_FROM_CONTACT = "WORD BRIDGE <contact@wordbridge.vn>"
EMAIL_REPLY_TO_SYSTEM = "cskh@wordbridge.vn"
EMAIL_PROVIDER = "unconfigured"
LEARNER_MEET_PROVIDER = "unconfigured"
LOGO_SVG_STATUS = "pending_official_svg"
ENVIRONMENT = "production"

# Cloudflare D1 — TUYỆT ĐỐI KHÔNG ĐỔI DATABASE NAME HOẶC DATABASE ID
[[d1_databases]]
binding = "DB"
database_name = "word"
database_id = "ce84cc48-6d49-409b-b45a-13ba3bc4a771"
migrations_dir = "database/migrations"

# Cloudflare R2 — TUYỆT ĐỐI KHÔNG ĐỔI BUCKET NAME
[[r2_buckets]]
binding = "R2"
bucket_name = "word"

# Tác vụ tự động định kỳ (Cron Triggers)
[triggers]
crons = [
  "*/15 * * * *",
  "0 1 * * *"
]

[observability]
enabled = true
