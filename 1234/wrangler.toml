# ==============================================================================
# WORD BRIDGE — Cloudflare Workers, D1 & R2 Configuration
# Website chính: https://www.wordbridge.vn/
# Ứng dụng PDF Reader độc lập (SSO): https://reader.wordbridge.vn/
# Database: Cloudflare D1 - word (ce84cc48-6d49-409b-b45a-13ba3bc4a771)
# Object Storage: Cloudflare R2 - word
# ==============================================================================

name = "word-bridge"
main = "src/worker.mjs"
compatibility_date = "2026-11-01"
workers_dev = true

[assets]
directory = "./dist/public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "word"
database_id = "ce84cc48-6d49-409b-b45a-13ba3bc4a771"
migrations_dir = "database/migrations"

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "word"

[vars]
APP_NAME = "WORD BRIDGE"
APP_TAGLINE = "Where Languages Bring People Together."
APP_URL = "https://www.wordbridge.vn"
PDF_READER_SSO_URL = "https://reader.wordbridge.vn"
EMAIL_FROM_NOREPLY = "WORD BRIDGE <noreply@wordbridge.vn>"
EMAIL_REPLY_TO_CSKH = "cskh@wordbridge.vn"
EMAIL_FROM_CSKH = "WORD BRIDGE CSKH <cskh@wordbridge.vn>"
EMAIL_FROM_CONTACT = "WORD BRIDGE Contact <contact@wordbridge.vn>"
STUDENT_PROMO_MONTHS = "3"
ENVIRONMENT = "development"

[env.staging]
name = "word-bridge-staging"
vars = { ENVIRONMENT = "staging", APP_URL = "https://staging.wordbridge.vn", PDF_READER_SSO_URL = "https://reader.wordbridge.vn" }

[[env.staging.d1_databases]]
binding = "DB"
database_name = "word"
database_id = "ce84cc48-6d49-409b-b45a-13ba3bc4a771"
migrations_dir = "database/migrations"

[[env.staging.r2_buckets]]
binding = "STORAGE"
bucket_name = "word"

[env.production]
name = "word-bridge"
routes = [
  { pattern = "www.wordbridge.vn/*", zone_name = "wordbridge.vn" },
  { pattern = "wordbridge.vn/*", zone_name = "wordbridge.vn" }
]
vars = { ENVIRONMENT = "production", APP_URL = "https://www.wordbridge.vn", PDF_READER_SSO_URL = "https://reader.wordbridge.vn" }

[[env.production.d1_databases]]
binding = "DB"
database_name = "word"
database_id = "ce84cc48-6d49-409b-b45a-13ba3bc4a771"
migrations_dir = "database/migrations"

[[env.production.r2_buckets]]
binding = "STORAGE"
bucket_name = "word"
